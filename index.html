<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JFR Ranch — Position Desk</title>
  <meta name="description" content="Unit economics, lot scorecard, and market position for JFR Ranch Co. Ltd." />
  <link rel="icon" href="/public/brand/mark.svg" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <main class="login-shell">
    <div class="card login-card">
      <div class="card-header">
        <img src="/public/brand/logo-lockup.svg" alt="JFR Ranch" width="160" height="140" />
        <h2 class="card-title" style="color: var(--foreground)">Position Desk</h2>
        <p class="card-description">Unit Economics &amp; Market Position</p>
      </div>
      <div class="card-content">
        <form id="login-form">
          <label class="field field-label-sm">
            Email
            <input type="email" id="login-email" required autocomplete="username" class="input" />
          </label>
          <label class="field field-label-sm">
            Password
            <input type="password" id="login-password" required autocomplete="current-password" class="input" />
          </label>
          <p class="login-error hidden" id="login-error"></p>
          <button type="submit" class="btn btn-primary mt-1" id="login-submit" style="width:100%">Sign in</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
